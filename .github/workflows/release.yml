name: Release

# Tauri cannot cross-compile: a Windows installer has to be built on Windows.
# This is what makes a .exe possible without owning a Windows machine.
on:
  push:
    tags:
      - "v*"
  # So a build can be produced without tagging, e.g. to hand someone a test copy.
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags: a tag can be repointed at
# new code by whoever owns the action, which would run inside our build
# and ship in the binaries users download. The trailing comment records
# which release each SHA corresponds to.

# The only write the run needs is creating the draft release and its
# assets. Everything else stays denied.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # One bundle that runs on both Apple Silicon and Intel, rather than
            # having to ask which Mac the person has.
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages. Installed copies refuse any update that
          # is not signed by this key, so a tampered download cannot pose as a
          # new version.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Only a tag push publishes a release. Run manually and these stay
          # empty, so the action just builds and the installers come back as
          # run artifacts instead of a release named after a branch.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Vault {0}', github.ref_name) || '' }}
          # A draft, so the release can be checked before anyone downloads it.
          releaseDraft: true
          prerelease: false
          # The manifest installed copies poll to discover a new version. It is
          # attached to the release, so publishing the draft is what actually
          # offers the update to everyone.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # workflow_dispatch has no tag to attach a release to, so the installers
      # are published as run artifacts instead.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: github.event_name == 'workflow_dispatch'
        with:
          name: vault-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: error

name: Release

# Tauri cannot cross-compile: a Windows installer has to be built on Windows.
# This is what makes a .exe possible without owning a Windows machine.
on:
  push:
    tags:
      - "v*"
  # So a build can be produced without tagging, e.g. to hand someone a test copy.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # One bundle that runs on both Apple Silicon and Intel, rather than
            # having to ask which Mac the person has.
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only a tag push publishes a release. Run manually and these stay
          # empty, so the action just builds and the installers come back as
          # run artifacts instead of a release named after a branch.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Vault {0}', github.ref_name) || '' }}
          # A draft, so the release can be checked before anyone downloads it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # workflow_dispatch has no tag to attach a release to, so the installers
      # are published as run artifacts instead.
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          name: vault-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: error

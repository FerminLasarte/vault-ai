version: 2

updates:
  # Actions are pinned to commit SHAs, which cannot pick up upstream fixes on
  # their own. Dependabot opens the bump as a pull request instead, so the new
  # SHA arrives reviewable rather than silently.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
